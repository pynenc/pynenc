<script>
  // Current invocation tracked for zoom + URL persistence
  let currentInvocationId = null;
  let currentInvocationData = null;
  let currentInvocationApiData = null;
  let currentAtomicServiceEl = null;
  let currentEventId = null;
  let currentEventData = null;
  const timelineRangeZoom = {
    enabled: false,
    dragging: false,
    startX: 0,
    currentX: 0,
    suppressNextClick: false,
  };
  const STATUS_COLOR_STYLES = {{ STATUS_COLOR_STYLES | tojson }};
  const DEFAULT_STATUS_STYLE = {{ DEFAULT_STATUS_STYLE | tojson }};
  const STATUS_BADGE_TEXT_COLOR = {{ STATUS_BADGE_TEXT_COLOR | tojson }};

  function normalizeStatusName(status) {
    const value = String(status ?? "").trim().toUpperCase();
    return value === "RETRYING" ? "RETRY" : value;
  }

  function getStatusStyle(status) {
    return (
      STATUS_COLOR_STYLES[normalizeStatusName(status)] || DEFAULT_STATUS_STYLE
    );
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => {
      const escaped = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char];
      return escaped || char;
    });
  }

  function getStatusBadgeStyle(status) {
    const colors = getStatusStyle(status);
    return `background-color: ${colors.background}; color: ${STATUS_BADGE_TEXT_COLOR};`;
  }

  function renderStatusBadge(status, size = "normal", label = null) {
    const sizeClass = size === "small" ? " badge-sm" : "";
    const displayLabel = label ?? status ?? "";
    return `<span class="badge pynmon-status-badge${sizeClass}" style="${getStatusBadgeStyle(
      status
    )}">${escapeHtml(displayLabel)}</span>`;
  }

  function getHistoryStatus(entry) {
    return (
      entry?.status ??
      entry?.status_name ??
      entry?.statusName ??
      entry?.status_record?.status ??
      entry?.statusRecord?.status ??
      ""
    );
  }

  function renderHistoryStatusBadge(entry) {
    const status = String(getHistoryStatus(entry) ?? "").trim();
    const displayLabel = status ? status.toLowerCase() : "unknown";
    return renderStatusBadge(status || "unknown", "small", displayLabel);
  }

  // ── Cross-highlight helpers ──────────────────────────────────────────
  // Highlight / unhighlight an invocation across BOTH the timeline SVG
  // and any family-tree SVG that may be loaded in the details panel.

  function highlightInvocation(invocationId, on = true) {
    // Timeline SVG (uses data-invocation-id)
    const timeline = document.getElementById("timeline-container");
    if (timeline) {
      timeline
        .querySelectorAll(`[data-invocation-id="${invocationId}"]`)
        .forEach((el) => {
          el.classList.toggle("invocation-highlight", on);
        });
    }
    // Family-tree SVG (uses data-inv-id)
    const ftBody = document.getElementById("ft-float-body");
    if (ftBody) {
      ftBody
        .querySelectorAll(`.ft-node[data-inv-id="${invocationId}"] rect`)
        .forEach((el) => {
          el.classList.toggle("invocation-highlight", on);
        });
      ftBody
        .querySelectorAll(`.ft-node[data-inv-id="${invocationId}"] text`)
        .forEach((el) => {
          el.classList.toggle("invocation-highlight", on);
        });
    }
  }

  function unhighlightInvocation(invocationId) {
    highlightInvocation(invocationId, false);
  }

  function splitIds(value) {
    return (value || "").split(/\s+/).filter(Boolean);
  }

  function setRelatedInvocationHighlight(invocationIds, on) {
    invocationIds.forEach((invocationId) => {
      if (!invocationId) return;
      if (on) {
        highlightInvocation(invocationId);
      } else if (invocationId !== currentInvocationId) {
        unhighlightInvocation(invocationId);
      }
    });
  }

  function relatedInvocationIdsForEvent(eventId, sourceEl) {
    const ids = new Set(splitIds(sourceEl?.dataset?.relatedInvocationIds));
    const timeline = document.getElementById("timeline-container");
    if (!timeline || !eventId) return ids;

    const safeEventId = CSS.escape(eventId);
    timeline
      .querySelectorAll(`.event-marker-link[data-event-id="${safeEventId}"]`)
      .forEach((marker) => {
        splitIds(marker.dataset.relatedInvocationIds).forEach((id) =>
          ids.add(id)
        );
      });
    timeline
      .querySelectorAll(
        `.event-trigger-relation-line[data-event-id="${safeEventId}"]`
      )
      .forEach((line) => {
        const childId = line.getAttribute("data-child-invocation-id");
        if (childId) ids.add(childId);
      });
    timeline
      .querySelectorAll(
        `.event-origin-relation-line[data-event-id="${safeEventId}"]`
      )
      .forEach((line) => {
        const sourceId = line.getAttribute("data-source-invocation-id");
        if (sourceId) ids.add(sourceId);
      });
    return ids;
  }

  function highlightEvent(eventId, on = true, sourceEl = null) {
    if (!eventId) return;
    const safeEventId = CSS.escape(eventId);
    document
      .querySelectorAll(
        `[data-event-id="${safeEventId}"], [data-related-event-id="${safeEventId}"]`
      )
      .forEach((el) => el.classList.toggle("event-highlight", on));
    setRelatedInvocationHighlight(
      relatedInvocationIdsForEvent(eventId, sourceEl),
      on
    );
  }

  function selectEvent(eventId, on = true) {
    if (!eventId) return;
    const safeEventId = CSS.escape(eventId);
    document
      .querySelectorAll(
        `[data-event-id="${safeEventId}"], [data-related-event-id="${safeEventId}"]`
      )
      .forEach((el) => el.classList.toggle("event-selected", on));
  }

  // Reverse mapping: given an invocation, find every event that either
  // triggered it (incoming `event_trigger_relation_line`) or was emitted
  // by it (`event_origin_relation_line`). Also walks event markers whose
  // `data-related-invocation-ids` enumerates this invocation. Lets the
  // SVG hover code light up the originating event marker(s) when a user
  // hovers an invocation bar, mirroring the existing event→invocation
  // highlight behaviour.
  function relatedEventIdsForInvocation(invocationId) {
    const ids = new Set();
    const timeline = document.getElementById("timeline-container");
    if (!timeline || !invocationId) return ids;
    const safe = CSS.escape(invocationId);
    timeline
      .querySelectorAll(
        `.event-trigger-relation-line[data-child-invocation-id="${safe}"]`
      )
      .forEach((line) => {
        const eid = line.getAttribute("data-event-id");
        if (eid) ids.add(eid);
      });
    timeline
      .querySelectorAll(
        `.event-origin-relation-line[data-source-invocation-id="${safe}"]`
      )
      .forEach((line) => {
        const eid = line.getAttribute("data-event-id");
        if (eid) ids.add(eid);
      });
    timeline
      .querySelectorAll(".event-marker-link[data-event-id]")
      .forEach((marker) => {
        if (
          splitIds(marker.dataset.relatedInvocationIds).includes(invocationId)
        ) {
          const eid = marker.getAttribute("data-event-id");
          if (eid) ids.add(eid);
        }
      });
    return ids;
  }

  // Returns the direct relation-line paths that connect ``invocationId``
  // to its originating / emitted events or to its parent / child invocation
  // via ``direct-call-relation-line``. We highlight only these so a hovered
  // invocation lights up its own connections rather than the entire fan.
  function directRelationLinesForInvocation(invocationId) {
    const out = [];
    const timeline = document.getElementById("timeline-container");
    if (!timeline || !invocationId) return out;
    const safe = CSS.escape(invocationId);
    timeline
      .querySelectorAll(
        `.event-trigger-relation-line[data-child-invocation-id="${safe}"], ` +
          `.event-origin-relation-line[data-source-invocation-id="${safe}"], ` +
          `.direct-call-relation-line[data-parent-invocation-id="${safe}"], ` +
          `.direct-call-relation-line[data-child-invocation-id="${safe}"]`
      )
      .forEach((line) => out.push(line));
    return out;
  }

  function setRelatedEventHighlight(eventIds, on, invocationId) {
    // Event markers + side-panel references light up via the event id.
    // Relation paths in the SVG also match ``[data-event-id]`` but we
    // skip them here so the broad highlight doesn't drown the timeline
    // in lit-up sibling lines; the direct connecting paths are toggled
    // separately below.
    eventIds.forEach((eid) => {
      if (!eid) return;
      const safe = CSS.escape(eid);
      document
        .querySelectorAll(
          `[data-event-id="${safe}"], [data-related-event-id="${safe}"]`
        )
        .forEach((el) => {
          if (el.classList.contains("timeline-relation-line")) return;
          el.classList.toggle("event-highlight", on);
        });
    });
    if (invocationId) {
      directRelationLinesForInvocation(invocationId).forEach((line) =>
        line.classList.toggle("event-highlight", on)
      );
    }
  }

  function eventHoverTarget(target) {
    return target?.closest(
      ".event-marker-link[data-event-id], " +
        ".event-origin-relation-line[data-event-id], " +
        ".event-trigger-relation-line[data-event-id], " +
        ".event-reference[data-event-id]"
    );
  }

  function invocationHoverTarget(target) {
    return target?.closest(".invocation-reference[data-invocation-id]");
  }

  // ── Trigger-run highlight helpers (Phase 5) ──────────────────────────
  // Status/result/exception/cron relation lines all carry
  // ``data-trigger-run-id``. Hovering any of them lights up every sibling
  // line that belongs to the same trigger run plus the source and target
  // invocation lanes.

  function triggerRunHoverTarget(target) {
    return target?.closest(
      ".event-marker-link[data-trigger-run-id], " +
        ".trigger-run-reference[data-trigger-run-id], " +
        ".status-trigger-relation-line[data-trigger-run-id], " +
        ".result-trigger-relation-line[data-trigger-run-id], " +
        ".exception-trigger-relation-line[data-trigger-run-id], " +
        ".cron-trigger-relation-line[data-trigger-run-id]"
    );
  }

  function highlightTriggerRun(triggerRunId, on = true) {
    if (!triggerRunId) return;
    const container = document.getElementById("timeline-container");
    if (!container) return;
    const safe = CSS.escape(triggerRunId);
    const relationItems = container.querySelectorAll(
      `.timeline-relation-line[data-trigger-run-id="${safe}"], ` +
        `.trigger-condition-marker[data-trigger-run-id="${safe}"]`
    );
    const relatedInvocationIds = new Set();
    container
      .querySelectorAll(`.event-marker-link[data-trigger-run-id="${safe}"]`)
      .forEach((marker) => {
        marker.classList.toggle("trigger-run-highlight", on);
        splitIds(marker.dataset.relatedInvocationIds).forEach((id) => {
          if (id) relatedInvocationIds.add(id);
        });
      });
    relationItems.forEach((item) => {
      item.classList.toggle("trigger-run-highlight", on);
      const src = item.getAttribute("data-source-invocation-id");
      const child = item.getAttribute("data-child-invocation-id");
      if (src) relatedInvocationIds.add(src);
      if (child) relatedInvocationIds.add(child);
    });
    setRelatedInvocationHighlight(relatedInvocationIds, on);
  }

  // ── Runner highlight helpers ─────────────────────────────────────────
  // Highlight / unhighlight all lane backgrounds and labels for a runner.

  function highlightRunner(runnerId, on = true) {
    const container = document.getElementById("timeline-container");
    if (!container) return;
    container
      .querySelectorAll(`[data-runner-id="${runnerId}"]`)
      .forEach((el) => {
        el.classList.toggle("runner-highlight", on);
      });
  }

  function unhighlightRunner(runnerId) {
    highlightRunner(runnerId, false);
  }

  function setTimelineDetailMode(kind) {
    const panel = document.getElementById("invocation-details-panel");
    const kicker = panel?.querySelector(".detail-kicker");
    const title = panel?.querySelector(".timeline-detail-header h6");
    const fullLink = document.getElementById("view-full-details");
    const zoomButton = document.getElementById("zoom-to-invocation");
    if (kind === "atomic-service") {
      if (kicker) kicker.textContent = "Selected atomic service";
      if (title) title.textContent = "Atomic service run";
      if (fullLink) fullLink.textContent = "View Runner";
      zoomButton?.classList.add("d-none");
      return;
    }
    if (kind === "event") {
      if (kicker) kicker.textContent = "Selected event";
      if (title) title.textContent = "Event details";
      if (fullLink) fullLink.textContent = "View Full Details";
      zoomButton?.classList.add("d-none");
      return;
    }
    if (kicker) kicker.textContent = "Selected invocation";
    if (title) title.textContent = "Invocation details";
    if (fullLink) fullLink.textContent = "View Full Details";
    zoomButton?.classList.remove("d-none");
  }

  function highlightAtomicService(el, on = true) {
    if (!el) return;
    el.classList.toggle("atomic-service-highlight", on);
    const runnerId = el.getAttribute("data-runner-id");
    if (runnerId) highlightRunner(runnerId, on);
  }

  function atomicServiceRunUrl(runId) {
    return `/runners/atomic-service/runs/${encodeURIComponent(runId)}`;
  }

  function cssAttrEscape(value) {
    if (window.CSS?.escape) return CSS.escape(value);
    return String(value).replace(/["\\]/g, "\\$&");
  }

  function findAtomicServiceWindowByRunId(runId) {
    if (!runId) return null;
    const escaped = cssAttrEscape(runId);
    return document.querySelector(
      `.atomic-service-window[data-atomic-service-run-id="${escaped}"]`
    );
  }

  function highlightAtomicServiceRun(runId, on = true) {
    const el = findAtomicServiceWindowByRunId(runId);
    if (!el) return null;
    if (!on && el === currentAtomicServiceEl) return el;
    highlightAtomicService(el, on);
    return el;
  }

  function parseIsoDate(value) {
    if (!value) return null;
    const parsed = new Date(value);
    return Number.isNaN(parsed.getTime()) ? null : parsed;
  }

  function formatTimelineParamDate(date) {
    return date
      .toISOString()
      .replace("Z", "")
      .replace(/(\.\d{3})$/, "$1000");
  }

  function timelineSvg() {
    return document.querySelector("#timeline-container svg");
  }

  function timelineZoomBounds(svg) {
    if (!svg) return null;
    const start = parseIsoDate(svg.dataset.startTime);
    const end = parseIsoDate(svg.dataset.endTime);
    const left = Number(svg.dataset.leftMargin);
    const width = Number(svg.dataset.contentWidth);
    const timelineWidth = Number(svg.dataset.timelineWidth);
    if (!start || !end || !Number.isFinite(left) || !Number.isFinite(width)) {
      return null;
    }
    return {
      start,
      end,
      left,
      right: Number.isFinite(timelineWidth) ? timelineWidth : left + width,
      width,
    };
  }

  function clientToSvgX(svg, event) {
    const bounds = timelineZoomBounds(svg);
    const matrix = svg?.getScreenCTM?.();
    if (!bounds || !matrix) return null;
    const point = svg.createSVGPoint();
    point.x = event.clientX;
    point.y = event.clientY;
    const svgPoint = point.matrixTransform(matrix.inverse());
    return Math.min(Math.max(svgPoint.x, bounds.left), bounds.right);
  }

  function ensureTimelineZoomSelection(svg) {
    let rect = svg.querySelector("#timeline-zoom-selection");
    if (rect) return rect;
    rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("id", "timeline-zoom-selection");
    rect.setAttribute("class", "timeline-zoom-selection");
    rect.setAttribute("y", "0");
    rect.setAttribute("height", String(svg.viewBox.baseVal.height || 0));
    rect.setAttribute("rx", "2");
    svg.appendChild(rect);
    return rect;
  }

  function updateTimelineZoomSelection(svg, startX, currentX) {
    const rect = ensureTimelineZoomSelection(svg);
    const x = Math.min(startX, currentX);
    const width = Math.abs(currentX - startX);
    rect.setAttribute("x", x.toFixed(1));
    rect.setAttribute("width", width.toFixed(1));
  }

  function clearTimelineZoomSelection() {
    document.getElementById("timeline-zoom-selection")?.remove();
  }

  function setTimelineRangeZoomEnabled(enabled) {
    timelineRangeZoom.enabled = enabled;
    timelineRangeZoom.dragging = false;
    const button = document.getElementById("timeline-range-zoom");
    const container = document.getElementById("timeline-container");
    button?.classList.toggle("active", enabled);
    button?.setAttribute("aria-pressed", enabled ? "true" : "false");
    container?.classList.toggle("timeline-zoom-active", enabled);
    container?.classList.remove("timeline-zoom-dragging");
    if (!enabled) clearTimelineZoomSelection();
  }

  function zoomTimelineToSvgRange(svg, startX, endX) {
    const bounds = timelineZoomBounds(svg);
    if (!bounds || Math.abs(endX - startX) < 8) return;
    const minX = Math.min(startX, endX);
    const maxX = Math.max(startX, endX);
    const startRatio = (minX - bounds.left) / bounds.width;
    const endRatio = (maxX - bounds.left) / bounds.width;
    const durationMs = bounds.end.getTime() - bounds.start.getTime();
    const selectedStart = new Date(
      bounds.start.getTime() + durationMs * startRatio
    );
    const selectedEnd = new Date(
      bounds.start.getTime() + durationMs * endRatio
    );
    if (selectedEnd <= selectedStart) return;

    const params = new URLSearchParams(window.location.search);
    params.set("time_range", "custom");
    params.set("start_date", formatTimelineParamDate(selectedStart));
    params.set("end_date", formatTimelineParamDate(selectedEnd));
    params.set("resolution", "100ms");
    window.location.href = "/invocations/timeline?" + params.toString();
  }

  function initTimelineRangeZoom() {
    const button = document.getElementById("timeline-range-zoom");
    const container = document.getElementById("timeline-container");
    const svg = timelineSvg();
    if (!button || !container) return;
    if (!svg || !timelineZoomBounds(svg)) {
      button.disabled = true;
      return;
    }

    button.addEventListener("click", () => {
      setTimelineRangeZoomEnabled(!timelineRangeZoom.enabled);
    });

    container.addEventListener("pointerdown", (event) => {
      if (!timelineRangeZoom.enabled || event.button !== 0) return;
      const svg = timelineSvg();
      const x = clientToSvgX(svg, event);
      if (x === null) return;
      event.preventDefault();
      event.stopPropagation();
      timelineRangeZoom.dragging = true;
      timelineRangeZoom.startX = x;
      timelineRangeZoom.currentX = x;
      timelineRangeZoom.suppressNextClick = true;
      container.classList.add("timeline-zoom-dragging");
      container.setPointerCapture?.(event.pointerId);
      updateTimelineZoomSelection(svg, x, x);
    });

    container.addEventListener("pointermove", (event) => {
      if (!timelineRangeZoom.dragging) return;
      const svg = timelineSvg();
      const x = clientToSvgX(svg, event);
      if (x === null) return;
      event.preventDefault();
      timelineRangeZoom.currentX = x;
      updateTimelineZoomSelection(svg, timelineRangeZoom.startX, x);
    });

    const finishDrag = (event, shouldZoom) => {
      if (!timelineRangeZoom.dragging) return;
      const svg = timelineSvg();
      const x = clientToSvgX(svg, event) ?? timelineRangeZoom.currentX;
      event.preventDefault();
      event.stopPropagation();
      container.releasePointerCapture?.(event.pointerId);
      container.classList.remove("timeline-zoom-dragging");
      timelineRangeZoom.dragging = false;
      timelineRangeZoom.currentX = x;
      if (shouldZoom && Math.abs(x - timelineRangeZoom.startX) >= 8) {
        setTimelineRangeZoomEnabled(false);
        zoomTimelineToSvgRange(svg, timelineRangeZoom.startX, x);
        return;
      }
      clearTimelineZoomSelection();
    };

    container.addEventListener("pointerup", (event) => finishDrag(event, true));
    container.addEventListener("pointercancel", (event) =>
      finishDrag(event, false)
    );
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && timelineRangeZoom.enabled) {
        setTimelineRangeZoomEnabled(false);
      }
    });
  }

  function collectTriggerZoomContext(apiData, invocationId) {
    const times = [];
    const invocationIds = new Set();
    const eventIds = [];
    if (invocationId) invocationIds.add(invocationId);

    const triggeredBy = apiData?.triggered_by;
    if (!triggeredBy) {
      if (apiData?.parent_event_id) eventIds.push(apiData.parent_event_id);
      return { times, invocationIds, eventIds };
    }

    [triggeredBy.claimed_at, triggeredBy.executed_at].forEach((value) => {
      const date = parseIsoDate(value);
      if (date) times.push(date);
    });
    (triggeredBy.source_invocation_ids || []).forEach((id) => {
      if (id) invocationIds.add(id);
    });
    (triggeredBy.event_ids || []).forEach((id) => {
      if (id) eventIds.push(id);
    });
    (triggeredBy.participants || []).forEach((participant) => {
      if (participant.source_invocation_id) {
        invocationIds.add(participant.source_invocation_id);
      }
      if (participant.event_id) eventIds.push(participant.event_id);
      const date = parseIsoDate(participant.context_timestamp);
      if (date) times.push(date);
    });
    return { times, invocationIds, eventIds };
  }

  // Zoom timeline to invocation + trigger-origin context, preserving selection.
  function zoomToInvocation(historyData, invocationId, apiData = null) {
    if (!historyData || historyData.length === 0) return;

    const triggerContext = collectTriggerZoomContext(apiData, invocationId);
    const visibleTimes = historyData
      .map((item) => parseIsoDate(item.timestamp))
      .filter(Boolean)
      .concat(triggerContext.times);
    const startTime = new Date(
      Math.min(...visibleTimes.map((date) => date.getTime()))
    );
    const endTime = new Date(
      Math.max(...visibleTimes.map((date) => date.getTime()))
    );
    const durationMs = Math.max(endTime - startTime, 0);
    const paddingMs =
      durationMs === 0 ? 100 : Math.min(Math.max(durationMs * 0.15, 50), 750);

    const paddedStart = new Date(startTime.getTime() - paddingMs);
    const paddedEnd = new Date(endTime.getTime() + paddingMs);
    const params = new URLSearchParams(window.location.search);
    params.set("time_range", "custom");
    params.set("start_date", formatTimelineParamDate(paddedStart));
    params.set("end_date", formatTimelineParamDate(paddedEnd));
    params.set("resolution", "100ms");
    // Carry selection forward so panel re-opens after page reload
    if (invocationId) params.set("selected", invocationId);
    const scopedIds = new Set(
      splitIds((params.get("inv_ids") || "").replaceAll(",", " "))
    );
    triggerContext.invocationIds.forEach((id) => scopedIds.add(id));
    if (scopedIds.size) params.set("inv_ids", Array.from(scopedIds).join(","));
    if (!params.get("focus_event") && triggerContext.eventIds.length) {
      params.set("focus_event", triggerContext.eventIds[0]);
    }

    window.location.href = "/invocations/timeline?" + params.toString();
  }

  function buildRunnerHtml(h) {
    if (!h.runner_cls) return '<span class="text-muted">-</span>';
    const rid = h.runner_id || "";

    let html = `<div class="timeline-runner-info" data-runner-id="${rid}" style="margin-bottom:4px;">
      <span class="badge bg-primary" style="font-size:9px;">${
        h.runner_cls
      }</span>
      <a href="/runners/${rid}" class="text-decoration-none" title="View runner details">
        <code style="font-size:9px;background:#e9ecef;padding:1px 3px;border-radius:2px;color:#0d6efd;">${
          rid || "N/A"
        }</code>
      </a></div>
      <div style="font-size:9px;color:#6c757d;margin-left:4px;">`;

    if (h.hostname) html += `host: <strong>${h.hostname}</strong> `;
    if (h.pid) html += `pid: <strong>${h.pid}</strong> `;
    if (h.thread_id) html += `thread: <strong>${h.thread_id}</strong>`;
    html += `</div>`;

    if (!h.parent_runner_id) return html;

    html += `<div class="timeline-runner-info" data-runner-id="${
      h.parent_runner_id
    }" style="margin-top:4px;padding-top:4px;border-top:1px dashed #dee2e6;">
      <span style="font-size:9px;color:#6c757d;">↳ Parent:</span>
      <span class="badge bg-secondary" style="font-size:9px;">${
        h.parent_runner_cls || "Unknown"
      }</span>
      <a href="/runners/${h.parent_runner_id}" class="text-decoration-none">
        <code style="font-size:9px;background:#e9ecef;padding:1px 3px;border-radius:2px;color:#0d6efd;">${
          h.parent_runner_id
        }</code>
      </a>
      <div style="font-size:9px;color:#6c757d;margin-left:12px;">`;
    if (h.parent_hostname)
      html += `host: <strong>${h.parent_hostname}</strong> `;
    if (h.parent_pid) html += `pid: <strong>${h.parent_pid}</strong> `;
    if (h.parent_thread_id)
      html += `thread: <strong>${h.parent_thread_id}</strong>`;
    html += `</div></div>`;
    return html;
  }

  function buildWorkflowRoleHtml(role) {
    if (!role) return '<span class="text-muted">—</span>';
    const subworkflowBadge = role.is_subworkflow
      ? ' <span class="badge bg-dark" style="font-size:9px;">sub-workflow</span>'
      : "";
    const description = role.description
      ? `<span class="text-muted" style="font-size:10px;">${role.description}</span>`
      : "";
    return `<span class="badge ${role.badge_class}">${
      role.label
    }</span>${subworkflowBadge}${
      description ? ` <span class="ms-1">${description}</span>` : ""
    }`;
  }

  function buildSummaryRows(invocationId, apiData, historyData) {
    const workflowRole = apiData?.workflow_role || null;
    const workflow = apiData?.workflow || null;
    let html = `<div class="timeline-detail-summary">
      <div class="detail-kicker">Invocation</div>
      <div class="timeline-detail-id"><code>${invocationId}</code></div>
    </div>
    <div class="detail-panel compact-detail-panel"><div class="detail-panel-body">
    <table class="table table-sm mb-0 timeline-detail-table">
      <tr><th style="width:130px;">Invocation ID</th>
          <td><code>${invocationId}</code></td></tr>`;

    if (apiData?.task_id_key) {
      html += `<tr><th>Task</th>
        <td><a href="/tasks/${apiData.task_id_key}" class="text-decoration-none">
          <code style="font-size:11px;">${apiData.task_id_key}</code></a></td></tr>`;
    }

    if (apiData?.parent_invocation_id) {
      const pid = apiData.parent_invocation_id;
      html += `<tr><th>Parent Invocation</th>
        <td><a href="/invocations/${pid}" class="invocation-link text-decoration-none"
              data-invocation-id="${pid}"
              style="color:#0d6efd;cursor:pointer;"
              onmouseenter="highlightInvocation('${pid}')"
              onmouseleave="unhighlightInvocation('${pid}')"
              onclick="event.preventDefault();loadInvocationDetails('${pid}')">
          <code style="font-size:11px;color:inherit;">${pid}</code></a></td></tr>`;
    }

    html += `<tr><th>Workflow</th><td>${buildWorkflowRoleHtml(workflowRole)}`;
    if (workflow) {
      html += ` <a href="/workflows/${encodeURIComponent(
        workflow.workflow_type
      )}" class="text-decoration-none ms-1">
          <code style="font-size:11px;">${workflow.workflow_type}</code></a>`;
    }
    html += `</td></tr>`;

    if (historyData?.length > 0) {
      const last = historyData[historyData.length - 1];
      html += `<tr><th>Status</th>
        <td>${renderHistoryStatusBadge(last)}</td></tr>
        <tr><th>Duration</th><td>${calculateDuration(historyData)}</td></tr>`;
    }

    html += `</table></div></div>`;
    return html;
  }

  function formatSeconds(value) {
    const num = Number.parseFloat(value);
    if (!Number.isFinite(num)) return "unknown";
    if (num < 0.001) return `${(num * 1000).toFixed(2)}ms`;
    if (num < 1) return `${(num * 1000).toFixed(1)}ms`;
    return `${num.toFixed(3)}s`;
  }

  function buildAtomicServiceRows(el) {
    const runnerId = el.getAttribute("data-runner-id") || "";
    const startTime = el.getAttribute("data-start-time") || "";
    const endTime = el.getAttribute("data-end-time") || "";
    const duration = el.getAttribute("data-duration-seconds") || "";
    const serviceRunId = el.getAttribute("data-atomic-service-run-id") || "";
    const recorded = el.getAttribute("data-atomic-service-recorded") !== "0";
    const serviceId =
      serviceRunId ||
      el.getAttribute("data-atomic-service-id") ||
      "atomic-service";
    const sourceBadge = recorded
      ? '<span class="badge bg-success">recorded</span>'
      : '<span class="badge bg-warning text-dark">trigger reference</span>';
    return `<div class="timeline-detail-summary">
      <div class="detail-kicker">Atomic service</div>
      <div class="timeline-detail-id"><code>${serviceId}</code></div>
    </div>
    <div class="detail-panel compact-detail-panel"><div class="detail-panel-body">
    <table class="table table-sm mb-0 timeline-detail-table">
      <tr><th style="width:130px;">Runner</th>
          <td><a href="/runners/${encodeURIComponent(
            runnerId
          )}" class="text-decoration-none"><code>${runnerId}</code></a></td></tr>
      ${
        serviceRunId
          ? `<tr><th>Service run</th><td><a href="${atomicServiceRunUrl(
              serviceRunId
            )}" class="atomic-service-run-link text-decoration-none" data-atomic-service-run-id="${serviceRunId}"><code>${serviceRunId}</code></a></td></tr>`
          : ""
      }
      <tr><th>Source</th><td>${sourceBadge}</td></tr>
      <tr><th>Start</th><td><code>${formatUTCDate(startTime)}</code></td></tr>
      <tr><th>End</th><td><code>${formatUTCDate(endTime)}</code></td></tr>
      <tr><th>Duration</th><td><span class="badge bg-info">${formatSeconds(
        duration
      )}</span></td></tr>
      <tr><th>Service</th><td>Trigger loop and runner-level recovery checks</td></tr>
    </table></div></div>`;
  }

  function buildHistoryRows(historyData) {
    if (!historyData?.length) return "";

    let html = `<div class="detail-panel compact-detail-panel mt-3">
      <div class="detail-panel-header">Status history</div>
      <div class="detail-panel-body p-0"><table class="table table-sm mb-0 timeline-detail-table"><thead>
        <tr><th>Status</th><th>Timestamp (UTC)</th><th>Runner Context</th></tr>
      </thead><tbody>`;

    historyData.forEach((h) => {
      html += `<tr>
        <td>${renderHistoryStatusBadge(h)}</td>
        <td style="font-size:11px;">${formatUTCDate(h.timestamp)}</td>
        <td style="font-size:11px;">${buildRunnerHtml(h)}</td>
      </tr>`;
    });

    html += `</tbody></table></div></div>`;
    return html;

  // ── Invocation summary card helper ───────────────────────────────────
  // Builds a mini rich card for a source invocation given its summary dict.
  function buildInvSummaryCard(invId, summary, runId) {
    const task = summary?.task_id_key || "";
    const funcName = summary?.func_name || "";
    const status = summary?.status || "";
    const dur = summary?.duration_seconds;
    const durTxt = dur != null ? `${dur.toFixed(2)}s` : "";
    const clickAttrs = runId
      ? `data-invocation-id="${invId}" data-trigger-run-id="${runId}"`
      : `data-invocation-id="${invId}"`;
    return `<a href="#" class="inv-summary-card invocation-reference${
      runId ? " trigger-run-reference" : ""
    }" ${clickAttrs}
        onclick="event.preventDefault();loadInvocationDetails('${invId}')">
      <div class="inv-summary-id">${invId}</div>
      ${funcName ? `<div class="inv-summary-task">${funcName}</div>` : ""}
      <div class="inv-summary-meta">
        ${
          status
            ? renderStatusBadge(status, "small", status)
            : ""
        }
        ${durTxt ? `<span class="inv-summary-duration">${durTxt}</span>` : ""}
      </div>
    </a>`;
  }

  function buildContextBadges(participants, runId, sourceInvocationId) {
    const types = [
      ...new Set(
        (participants || [])
          .filter(
            (p) =>
              !sourceInvocationId ||
              p.source_invocation_id === sourceInvocationId
          )
          .map((p) => p.context_type)
          .filter(Boolean)
      ),
    ];
    return types
      .map(
        (t) =>
          `<span class="badge bg-info trigger-run-reference" data-trigger-run-id="${runId}" style="font-size:9px;">${t}</span>`
      )
      .join(" ");
  }

  function buildEventPills(eventIds, relatedInvocationIds, eventSummaries) {
    if (!eventIds?.length) return "";
    const relatedIds = relatedInvocationIds.filter(Boolean).join(" ");
    const summaries = eventSummaries || {};
    const escape = (v) =>
      String(v).replace(
        /[&<>"']/g,
        (c) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c])
      );
    return eventIds
      .map((eid) => {
        const s = summaries[eid] || {};
        const code = s.event_code
          ? `<span class="event-pill-code">${escape(s.event_code)}</span>`
          : "";
        const state = s.state
          ? `<span class="event-pill-state state-${escape(s.state)}">${escape(
              s.state
            )}</span>`
          : "";
        const ts = s.timestamp
          ? `<span class="event-pill-time">${escape(s.timestamp)}</span>`
          : "";
        const triggered =
          s.triggered_count > 0
            ? `<span class="event-pill-triggered">→ ${s.triggered_count} inv</span>`
            : "";
        const stateAttr = s.state
          ? ` data-event-state="${escape(s.state)}"`
          : "";
        return `<a href="/events/${eid}" class="event-pill-rich event-reference" data-event-id="${eid}" data-related-invocation-ids="${relatedIds}"${stateAttr} title="${eid}">
          ${code}
          <span class="event-pill-id"><code>${eid}</code></span>
          <span class="event-pill-meta">${state}${ts}${triggered}</span>
        </a>`;
      })
      .join("");
  }

  function shortMonitoringId(value, head = 22, tail = 12) {
    const text = String(value || "");
    if (text.length <= head + tail + 1) return text;
    return `${text.slice(0, head)}...${text.slice(-tail)}`;
  }

  function buildParticipantCards(
    participants,
    runId,
    invocationSummaries,
    relatedInvocationIds,
    options = {}
  ) {
    if (!participants?.length) return "";
    const includeTimestamp = options.includeTimestamp === true;
    const eventSummaries = options.eventSummaries || {};
    return `<div class="trigger-participant-list">${participants
      .map((participant) => {
        const conditionId = participant.condition_id || "";
        const sourceInvocationId = participant.source_invocation_id || "";
        const eventId = participant.event_id || "";
        let source = '<span class="text-muted">—</span>';
        if (sourceInvocationId) {
          source = buildInvSummaryCard(
            sourceInvocationId,
            invocationSummaries?.[sourceInvocationId] || {},
            runId
          );
        } else if (eventId) {
          source = `<a href="/events/${encodeURIComponent(
            eventId
          )}" class="event-pill event-reference" data-event-id="${eventId}" data-related-invocation-ids="${(
            relatedInvocationIds || []
          )
            .filter(Boolean)
            .join(" ")}"><code>${shortMonitoringId(eventId)}</code></a>`;
          if (eventSummaries[eventId]) {
            source = buildEventPills(
              [eventId],
              relatedInvocationIds || [],
              eventSummaries
            );
          }
        }
        return `<div class="trigger-participant-item" data-context-type="${
          participant.context_type || ""
        }">
          <dl class="event-context-list mb-0">
            <dt>Context</dt><dd><span class="badge bg-info">${
              participant.context_type || "Unknown"
            }</span></dd>
            <dt>Condition</dt><dd>${
              conditionId
                ? `<a href="/trigger-runs/condition?condition_id=${encodeURIComponent(
                    conditionId
                  )}" title="${conditionId}"><code>${shortMonitoringId(
                    conditionId
                  )}</code></a>`
                : '<span class="text-muted">—</span>'
            }</dd>
            <dt>Source</dt><dd>${source}</dd>
            ${
              includeTimestamp
                ? `<dt>Timestamp</dt><dd>${
                    participant.context_timestamp
                      ? `<code>${participant.context_timestamp}</code>`
                      : '<span class="text-muted">—</span>'
                  }</dd>`
                : ""
            }
          </dl>
        </div>`;
      })
      .join("")}</div>`;
  }

  function buildTriggerRunCards(
    triggerRuns,
    invocationSummaries,
    heading = "Trigger runs"
  ) {
    if (!triggerRuns?.length) return "";
    return `<section class="event-context-section mt-3">
      <div class="event-context-heading">
        <span>${heading}</span>
        <span class="badge bg-secondary">${triggerRuns.length}</span>
      </div>
      <div class="trigger-caused-list">${triggerRuns
        .map((run) => {
          const runId = run.trigger_run_id || "";
          const triggerId = run.trigger_id || "";
          const targetId = run.triggered_invocation_id || "";
          const atomicRunId = run.atomic_service_run_id || "";
          const summaries = {
            ...(invocationSummaries || {}),
            ...(run.invocation_summaries || {}),
          };
          const participants = buildParticipantCards(
            run.participants || [],
            runId,
            summaries,
            [targetId, ...(run.source_invocation_ids || [])]
          );
          return `<article class="trigger-caused-item trigger-run-reference" data-trigger-run-id="${runId}">
            <dl class="event-context-list mb-0">
              <dt>Trigger run</dt><dd><a href="/trigger-runs/${encodeURIComponent(
                runId
              )}" class="trigger-run-reference text-decoration-none" data-trigger-run-id="${runId}"><code>${runId}</code></a></dd>
              ${
                triggerId
                  ? `<dt>Trigger</dt><dd><a href="/triggers/${encodeURIComponent(
                      triggerId
                    )}" class="text-decoration-none"><code>${triggerId}</code></a></dd>`
                  : ""
              }
              ${
                run.task_id_key
                  ? `<dt>Task</dt><dd><a href="/tasks/${encodeURIComponent(
                      run.task_id_key
                    )}" class="text-decoration-none"><code>${
                      run.task_id_key
                    }</code></a></dd>`
                  : ""
              }
              <dt>Logic</dt><dd><span class="badge bg-secondary">${
                run.logic_value || "—"
              }</span></dd>
              ${
                targetId
                  ? `<dt>Triggered invocation</dt><dd>${buildInvSummaryCard(
                      targetId,
                      summaries[targetId] || {},
                      runId
                    )}</dd>`
                  : ""
              }
              ${
                run.executed_at
                  ? `<dt>Executed at</dt><dd><code>${formatUTCDate(
                      run.executed_at
                    )}</code></dd>`
                  : ""
              }
              ${
                atomicRunId
                  ? `<dt>Atomic-service run</dt><dd><a href="${atomicServiceRunUrl(
                      atomicRunId
                    )}" class="atomic-service-run-link text-decoration-none" data-atomic-service-run-id="${atomicRunId}"><code>${atomicRunId}</code></a></dd>`
                  : ""
              }
            </dl>
            ${
              participants
                ? `<div class="trigger-participants-heading">Matched conditions</div>${participants}`
                : ""
            }
          </article>`;
        })
        .join("")}</div>
    </section>`;
  }

  // ── Triggering information in the invocation panel ───────────────────
  // Renders trigger origin, reverse trigger effects, and emitted events as a
  // full-width block between the invocation summary and status history.
  function buildTriggeringSection(apiData) {
    const triggeredBy = apiData?.triggered_by;
    const emitted = apiData?.emitted_events || [];
    const causedRuns = apiData?.triggered_runs_caused || [];
    const parentEventId = apiData?.parent_event_id;
    const srcSummaries = apiData?.source_inv_summaries || {};
    const eventSummaries = apiData?.source_event_summaries || {};

    if (
      !triggeredBy &&
      !emitted.length &&
      !parentEventId &&
      !causedRuns.length
    ) {
      return "";
    }
    const relatedCount =
      emitted.length +
      causedRuns.length +
      (triggeredBy?.event_ids?.length || 0) +
      (!triggeredBy && parentEventId ? 1 : 0);
    const hasTriggerRelations =
      Boolean(triggeredBy) || Boolean(parentEventId) || causedRuns.length > 0;

    let html = `<div class="detail-panel compact-detail-panel timeline-triggering-panel mt-3">
      <div class="detail-panel-header">
        Triggering information
        <span class="badge bg-secondary">${relatedCount}</span>
      </div>
      <div class="detail-panel-body event-context-stack">`;
    if (hasTriggerRelations) {
      html += `<div class="timeline-trigger-summary-grid">`;
    }

    if (triggeredBy) {
      const runId = triggeredBy.trigger_run_id;
      const logic = triggeredBy.logic_value || "—";
      const srcIds = triggeredBy.source_invocation_ids || [];
      const participants = triggeredBy.participants || [];
      const timelineUrl = triggeredBy.timeline_url || "";
      const participantCards = buildParticipantCards(
        participants,
        runId,
        srcSummaries,
        [currentInvocationId, ...srcIds],
        {
          includeTimestamp: true,
          eventSummaries,
        }
      );

      html += `<section class="event-context-section trigger-run-reference" data-trigger-run-id="${runId}">
        <div class="event-context-heading">
          <span>Trigger origin</span>
          <span class="badge bg-secondary">${logic}</span>
        </div>
        <div class="trigger-origin-stack">
        <div class="trigger-caused-item">
        <dl class="event-context-list mb-0">
          <dt>Trigger run</dt><dd>
            <a href="/trigger-runs/${runId}" class="trigger-run-reference text-decoration-none" data-trigger-run-id="${runId}"><code>${runId}</code></a>
            ${
              timelineUrl
                ? `<a href="${timelineUrl}" class="ms-1 text-decoration-none" title="Open trigger run in timeline"><span class="material-icons" style="font-size:14px;vertical-align:middle;color:#28a745;">timeline</span></a>`
                : ""
            }
          </dd>`;
      if (triggeredBy.trigger_id) {
        html += `<dt>Trigger ID</dt><dd><a href="/triggers/${encodeURIComponent(
          triggeredBy.trigger_id
        )}" class="text-decoration-none"><code>${
          triggeredBy.trigger_id
        }</code></a></dd>`;
      }
      if (triggeredBy.executed_at) {
        html += `<dt>Triggered at</dt><dd><code>${triggeredBy.executed_at}</code></dd>`;
      }
      html += `</dl></div>`;
      if (participantCards) {
        html += participantCards;
      }
      html += `</div></section>`;
    } else if (parentEventId) {
      html += `<section class="event-context-section">
        <div class="event-context-heading"><span>Trigger origin</span></div>
        <dl class="event-context-list"><dt>Parent event</dt><dd>
          <a href="/events/${parentEventId}" class="event-pill event-reference" data-event-id="${parentEventId}" data-related-invocation-ids="${
        currentInvocationId || ""
      }"><code>${parentEventId.slice(0, 8)}...</code></a>
        </dd></dl>
      </section>`;
    }

    if (causedRuns.length) {
      html += `<section class="event-context-section">
        <div class="event-context-heading">
          <span>Triggers caused by this invocation</span>
          <span class="badge bg-secondary">${causedRuns.length}</span>
        </div>
        <div class="trigger-caused-list">`;
      causedRuns.forEach((run) => {
        const runId = run.trigger_run_id;
        const childId = run.triggered_invocation_id;
        const evIds = run.event_ids || [];
        const participants = run.participants || [];
        const timelineUrl = run.timeline_url || "";
        const contextBadges = buildContextBadges(
          participants,
          runId,
          currentInvocationId
        );
        html += `<div class="trigger-caused-item trigger-run-reference" data-trigger-run-id="${runId}">
          <dl class="event-context-list mb-0">
            <dt>Trigger run</dt><dd><a href="/trigger-runs/${runId}" class="trigger-run-reference text-decoration-none" data-trigger-run-id="${runId}"><code>${runId}</code></a>
              ${
                timelineUrl
                  ? `<a href="${timelineUrl}" class="ms-1 text-decoration-none" title="Open trigger run in timeline"><span class="material-icons" style="font-size:14px;vertical-align:middle;color:#28a745;">timeline</span></a>`
                  : ""
              }</dd>`;
        if (childId) {
          html += `<dt>Triggered invocation</dt><dd>${buildInvSummaryCard(
            childId,
            srcSummaries[childId] || {},
            runId
          )}</dd>`;
        }
        if (run.task_id_key) {
          html += `<dt>Task</dt><dd><code>${run.task_id_key}</code></dd>`;
        }
        if (evIds.length) {
          html += `<dt>Source events</dt><dd class="event-pill-row">${buildEventPills(
            evIds,
            [currentInvocationId, childId],
            eventSummaries
          )}</dd>`;
        }
        if (contextBadges) {
          html += `<dt>Source type</dt><dd>${contextBadges}</dd>`;
        }
        html += `</dl></div>`;
      });
      html += `</div></section>`;
    }

    if (hasTriggerRelations) {
      html += `</div>`;
    }

    if (emitted.length) {
      html += `<section class="event-context-section">
        <div class="event-context-heading">
          <span>Events emitted by this invocation</span>
          <span class="badge bg-secondary">${emitted.length}</span>
        </div>
        <div class="emitted-events-list">`;
      emitted.forEach((e) => {
        const triggeredIds = (e.triggered_invocation_ids || []).filter(Boolean);
        const relatedIds = [currentInvocationId, ...triggeredIds]
          .filter(Boolean)
          .join(" ");
        const stateBadge = e.triggered
          ? '<span class="badge bg-success" style="font-size:9px;">triggered</span>'
          : e.matched
          ? '<span class="badge bg-primary" style="font-size:9px;">matched</span>'
          : '<span class="badge bg-secondary" style="font-size:9px;">recorded</span>';
        const tsTxt = e.timestamp
          ? `<span class="emitted-event-ts"><code>${e.timestamp}</code></span>`
          : "";
        html += `<div class="emitted-event-item event-reference"
            data-event-id="${e.event_id}"
            data-related-invocation-ids="${relatedIds}">
          <div class="emitted-event-head">
            <code class="emitted-event-code">${e.event_code}</code>
            ${stateBadge}
            ${tsTxt}
            <a href="/events/${e.event_id}" class="ms-auto text-decoration-none"
               title="${e.event_id}"><code>${e.event_id.slice(0, 8)}…</code></a>
          </div>`;
        if (triggeredIds.length) {
          html += `<div class="emitted-event-triggered">
            <span class="emitted-event-triggered-label">Triggered invocations (${
              triggeredIds.length
            })</span>
            <div class="inv-summary-card-row">${triggeredIds
              .map((sid) =>
                buildInvSummaryCard(sid, srcSummaries[sid] || {}, null)
              )
              .join("")}</div>
          </div>`;
        }
        html += `</div>`;
      });
      html += `</div></section>`;
    }

    html += `</div></div>`;
    return html;
  }

  function loadInvocationDetails(invocationId, opts) {
    opts = opts || {};
    const panel = document.getElementById("invocation-details-panel");
    const content = document.getElementById("invocation-details-content");
    const fullLink = document.getElementById("view-full-details");

    setTimelineDetailMode("invocation");

    // Un-highlight previously selected timeline item
    if (currentInvocationId) unhighlightInvocation(currentInvocationId);
    if (currentAtomicServiceEl)
      highlightAtomicService(currentAtomicServiceEl, false);

    currentInvocationId = invocationId;
    currentAtomicServiceEl = null;
    currentInvocationData = null;
    currentInvocationApiData = null;
    panel.classList.remove("d-none");
    content.innerHTML = `<div class="d-flex justify-content-center">
      <div class="spinner-border spinner-border-sm text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div></div>`;
    fullLink.href = `/invocations/${invocationId}`;

    // Highlight the selected invocation in the timeline SVG
    highlightInvocation(invocationId);

    // Load family tree into floating panel (resets expansion state)
    if (!opts.skipTree && typeof window._ftLoadTree === "function") {
      if (typeof window._ftResetExpanded === "function")
        window._ftResetExpanded();
      window._ftLoadTree(invocationId);
    }

    Promise.all([
      fetch(`/invocations/${invocationId}/api`).then((r) =>
        r.ok ? r.json() : null
      ),
      fetch(`/invocations/${invocationId}/history`).then((r) =>
        r.ok ? r.json() : []
      ),
    ])
      .then(([apiData, historyData]) => {
        currentInvocationData = historyData;
        currentInvocationApiData = apiData;
        content.innerHTML =
          buildSummaryRows(invocationId, apiData, historyData) +
          buildTriggeringSection(apiData) +
          buildHistoryRows(historyData);
      })
      .catch((err) => {
        console.error("Error loading invocation details:", err);
        currentInvocationId = null;
        currentInvocationData = null;
        currentInvocationApiData = null;
        content.innerHTML = `<div class="alert alert-danger mb-0">Error loading details: ${err.message}</div>`;
      });
  }

  function loadAtomicServiceDetails(el) {
    const panel = document.getElementById("invocation-details-panel");
    const content = document.getElementById("invocation-details-content");
    const fullLink = document.getElementById("view-full-details");
    const runnerId = el.getAttribute("data-runner-id") || "";
    const serviceRunId = el.getAttribute("data-atomic-service-run-id") || "";

    setTimelineDetailMode("atomic-service");
    if (currentInvocationId) unhighlightInvocation(currentInvocationId);
    if (currentAtomicServiceEl)
      highlightAtomicService(currentAtomicServiceEl, false);
    if (currentEventId) {
      highlightEvent(currentEventId, false);
      selectEvent(currentEventId, false);
    }

    currentInvocationId = null;
    currentInvocationData = null;
    currentInvocationApiData = null;
    currentAtomicServiceEl = el;
    currentEventId = null;
    currentEventData = null;
    panel.classList.remove("d-none");
    if (serviceRunId) {
      fullLink.href = atomicServiceRunUrl(serviceRunId);
      fullLink.textContent = "View Run";
    } else {
      fullLink.href = `/runners/${encodeURIComponent(runnerId)}`;
      fullLink.textContent = "View Runner";
    }
    content.innerHTML = buildAtomicServiceRows(el);
    highlightAtomicService(el, true);
  }

  function wireAtomicServiceRunHover(container) {
    if (!container) return;
    container.addEventListener("mouseover", (e) => {
      const link = e.target.closest(
        ".atomic-service-run-link[data-atomic-service-run-id]"
      );
      if (link)
        highlightAtomicServiceRun(link.dataset.atomicServiceRunId, true);
    });
    container.addEventListener("mouseout", (e) => {
      const link = e.target.closest(
        ".atomic-service-run-link[data-atomic-service-run-id]"
      );
      if (link && !link.contains(e.relatedTarget)) {
        highlightAtomicServiceRun(link.dataset.atomicServiceRunId, false);
      }
    });
    container.addEventListener("focusin", (e) => {
      const link = e.target.closest(
        ".atomic-service-run-link[data-atomic-service-run-id]"
      );
      if (link)
        highlightAtomicServiceRun(link.dataset.atomicServiceRunId, true);
    });
    container.addEventListener("focusout", (e) => {
      const link = e.target.closest(
        ".atomic-service-run-link[data-atomic-service-run-id]"
      );
      if (link)
        highlightAtomicServiceRun(link.dataset.atomicServiceRunId, false);
    });
  }

  function buildEventRows(eventId, payload) {
    const evt = payload?.event || {};
    const triggerRuns = payload?.trigger_runs || [];
    const invocationSummaries = payload?.invocation_summaries || {};
    const code = evt.event_code || "event";
    const ts = evt.timestamp ? formatUTCDate(evt.timestamp) : "";
    const emitter = evt.emitted_by_invocation_id;
    const emitterTask = evt.emitted_by_task_id;
    const triggered = evt.triggered_invocation_ids || [];
    const matched = evt.matched ? "yes" : "no";
    const fired = evt.triggered ? "yes" : "no";
    let payloadStr = "";
    if (evt.payload != null) {
      try {
        payloadStr = JSON.stringify(evt.payload, null, 2);
      } catch (_) {
        payloadStr = String(evt.payload);
      }
    }

    let html = `<div class="timeline-detail-summary">
      <div class="detail-kicker">Event</div>
      <div class="timeline-detail-id"><code>${code}</code></div>
    </div>
    <div class="detail-panel compact-detail-panel"><div class="detail-panel-body">
    <table class="table table-sm mb-0 timeline-detail-table">
      <tr><th style="width:130px;">Event ID</th><td><code>${eventId}</code></td></tr>
      <tr><th>Timestamp</th><td><code>${ts}</code></td></tr>
      <tr><th>Matched</th><td><span class="badge bg-${
        evt.matched ? "info" : "secondary"
      }">${matched}</span></td></tr>
      <tr><th>Triggered</th><td><span class="badge bg-${
        evt.triggered ? "success" : "secondary"
      }">${fired}</span></td></tr>`;
    if (emitterTask) {
      html += `<tr><th>Emitted by task</th><td><code>${emitterTask}</code></td></tr>`;
    }
    if (emitter) {
      html += `<tr><th>Emitted by</th><td>${buildInvSummaryCard(
        emitter,
        invocationSummaries[emitter] || {},
        null
      )}</td></tr>`;
    }
    html += `</table></div></div>`;

    const runTargetIds = new Set(
      triggerRuns.map((run) => run.triggered_invocation_id).filter(Boolean)
    );
    const unlinkedTriggeredIds = triggered.filter(
      (id) => !runTargetIds.has(id)
    );
    if (unlinkedTriggeredIds.length) {
      html += `<div class="detail-panel compact-detail-panel mt-3">
        <div class="detail-panel-header">Other triggered invocations (${
          unlinkedTriggeredIds.length
        })</div>
        <div class="detail-panel-body"><div class="inv-summary-card-row">${unlinkedTriggeredIds
          .map((id) =>
            buildInvSummaryCard(id, invocationSummaries[id] || {}, null)
          )
          .join("")}</div></div></div>`;
    }

    html += buildTriggerRunCards(
      triggerRuns,
      invocationSummaries,
      "Triggers involving this event"
    );

    if (payloadStr) {
      html += `<div class="detail-panel compact-detail-panel mt-3">
        <div class="detail-panel-header">Payload</div>
        <div class="detail-panel-body"><pre class="mb-0" style="font-size:11px; white-space:pre-wrap;">${payloadStr.replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])
        )}</pre></div></div>`;
    }
    return html;
  }

  function buildCronTickRows(eventId, sourceEl, payload) {
    const triggerRuns = payload?.trigger_runs || [];
    const firstRun = triggerRuns[0] || {};
    const ts = sourceEl?.dataset?.eventTimestamp || "";
    const targetIds = [
      ...new Set(
        triggerRuns.map((run) => run.triggered_invocation_id).filter(Boolean)
      ),
    ];
    let html = `<div class="timeline-detail-summary">
      <div class="detail-kicker">Cron tick</div>
      <div class="timeline-detail-id"><code>cron.tick</code></div>
    </div>
    <div class="detail-panel compact-detail-panel"><div class="detail-panel-body">
    <table class="table table-sm mb-0 timeline-detail-table">
      <tr><th style="width:140px;">Marker ID</th><td><code>${eventId}</code></td></tr>`;
    if (ts) {
      html += `<tr><th>Tick</th><td><code>${ts}</code></td></tr>`;
    }
    html += `<tr><th>Trigger runs</th><td><span class="badge bg-secondary">${triggerRuns.length}</span></td></tr>
      <tr><th>Triggered invocations</th><td><span class="badge bg-success">${targetIds.length}</span></td></tr>`;
    const atomicRunner =
      sourceEl?.dataset?.atomicServiceRunnerId ||
      firstRun.atomic_service_runner_id ||
      "";
    const atomicRunId =
      sourceEl?.dataset?.atomicServiceRunId ||
      firstRun.atomic_service_run_id ||
      "";
    if (atomicRunner) {
      html += `<tr><th>Atomic-service runner</th><td><a href="/runners/atomic-service/timeline?runner_id=${encodeURIComponent(
        atomicRunner
      )}" class="text-decoration-none"><code>${atomicRunner}</code></a></td></tr>`;
    }
    if (atomicRunId) {
      html += `<tr><th>Atomic-service run</th><td><a href="${atomicServiceRunUrl(
        atomicRunId
      )}" class="atomic-service-run-link text-decoration-none" data-atomic-service-run-id="${atomicRunId}"><code>${atomicRunId}</code></a></td></tr>`;
    }
    html += `</table></div></div>`;
    const invocationSummaries = Object.assign(
      {},
      ...triggerRuns.map((run) => run.invocation_summaries || {})
    );
    html += buildTriggerRunCards(
      triggerRuns,
      invocationSummaries,
      "Triggers from this tick"
    );
    return html;
  }

  function loadEventDetails(eventId, sourceEl) {
    // Event detail lives in its OWN panel beside the invocation panel,
    // so opening an event must never clear a previously-selected
    // invocation. Only the event-specific state is reset here.
    const panel = document.getElementById("event-details-panel");
    const content = document.getElementById("event-details-content");
    const fullLink = document.getElementById("view-full-event");

    if (currentEventId && currentEventId !== eventId) {
      highlightEvent(currentEventId, false);
      selectEvent(currentEventId, false);
    }

    currentEventId = eventId;
    currentEventData = null;

    panel.classList.remove("d-none");
    // Synthetic cron markers carry their own href to the trigger-run page
    // (no EventRecord exists). For real events keep the /events/{id} link.
    const isCron = typeof eventId === "string" && eventId.startsWith("cron:");
    const linkHref =
      sourceEl?.getAttribute?.("href") ||
      (isCron ? "#" : `/events/${encodeURIComponent(eventId)}`);
    fullLink.href = linkHref;
    content.innerHTML = `<div class="d-flex justify-content-center">
      <div class="spinner-border spinner-border-sm text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div></div>`;
    selectEvent(eventId, true);
    highlightEvent(eventId, true, sourceEl);

    if (isCron) {
      const runIds = splitIds(
        sourceEl?.dataset?.triggerRunIds ||
          sourceEl?.dataset?.triggerRunId ||
          ""
      );
      if (!runIds.length) {
        content.innerHTML = `<div class="alert alert-warning mb-0">Cron tick has no associated trigger run.</div>`;
        return;
      }
      const groupedServiceTick = Boolean(
        sourceEl?.dataset?.atomicServiceRunId || runIds.length > 1
      );
      fullLink.textContent = groupedServiceTick
        ? "View Service Run"
        : "View Trigger Run";
      Promise.all(
        runIds.map((runId) =>
          fetch(`/trigger-runs/${encodeURIComponent(runId)}/api`).then((r) =>
            r.ok ? r.json() : Promise.reject(new Error("not found"))
          )
        )
      )
        .then((runs) => {
          currentEventData = { trigger_runs: runs };
          content.innerHTML = buildCronTickRows(
            eventId,
            sourceEl,
            currentEventData
          );
        })
        .catch((err) => {
          console.error("Error loading cron tick details:", err);
          content.innerHTML = `<div class="alert alert-danger mb-0">Error loading cron tick: ${err.message}</div>`;
        });
      return;
    }

    fullLink.textContent = "View Full Details";
    fetch(`/events/${encodeURIComponent(eventId)}/api`)
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error("not found"))))
      .then((data) => {
        currentEventData = data;
        content.innerHTML = buildEventRows(eventId, data);
      })
      .catch((err) => {
        console.error("Error loading event details:", err);
        content.innerHTML = `<div class="alert alert-danger mb-0">Error loading event: ${err.message}</div>`;
      });
  }

  function formatUTCDate(isoString) {
    const d = new Date(isoString);
    const ms = d.getUTCMilliseconds().toString().padStart(3, "0");
    return (
      d.toISOString().replace("T", " ").substring(0, 19) + "." + ms + " UTC"
    );
  }

  function calculateDuration(history) {
    if (!history || history.length < 2) return "N/A";
    const ms =
      new Date(history[history.length - 1].timestamp) -
      new Date(history[0].timestamp);
    if (ms < 1000) return `${ms}ms`;
    if (ms < 60000) return `${(ms / 1000).toFixed(2)}s`;
    if (ms < 3600000)
      return `${Math.floor(ms / 60000)}m ${Math.floor((ms % 60000) / 1000)}s`;
    return `${Math.floor(ms / 3600000)}h ${Math.floor(
      (ms % 3600000) / 60000
    )}m`;
  }

  document.addEventListener("DOMContentLoaded", function () {
    initTimelineRangeZoom();

    // Show/hide custom date range inputs
    document
      .getElementById("time_range")
      ?.addEventListener("change", function () {
        document
          .getElementById("custom_date_range")
          ?.classList.toggle("d-none", this.value !== "custom");
      });

    // Close invocation details panel (event panel has its own button).
    document.getElementById("close-details")?.addEventListener("click", () => {
      if (currentInvocationId) unhighlightInvocation(currentInvocationId);
      if (currentAtomicServiceEl)
        highlightAtomicService(currentAtomicServiceEl, false);
      document
        .getElementById("invocation-details-panel")
        .classList.add("d-none");
      document
        .getElementById("invocation-events-section")
        ?.classList.add("d-none");
      document
        .getElementById("invocation-details-main")
        ?.classList.remove("col-lg-8");
      document
        .getElementById("invocation-details-main")
        ?.classList.add("col-12");
      currentInvocationId = null;
      currentInvocationData = null;
      currentInvocationApiData = null;
      currentAtomicServiceEl = null;
    });

    // Close event details panel independently.
    document
      .getElementById("close-event-details")
      ?.addEventListener("click", () => {
        if (currentEventId) {
          highlightEvent(currentEventId, false);
          selectEvent(currentEventId, false);
        }
        document.getElementById("event-details-panel").classList.add("d-none");
        currentEventId = null;
        currentEventData = null;
      });

    // Zoom to invocation (pass ID so it's preserved in the URL)
    document
      .getElementById("zoom-to-invocation")
      ?.addEventListener("click", () => {
        if (currentInvocationData?.length > 0) {
          zoomToInvocation(
            currentInvocationData,
            currentInvocationId,
            currentInvocationApiData
          );
        }
      });

    // Zoom to event \u2014 centre the timeline on the event timestamp with
    // a small symmetric buffer so the surrounding context stays visible.
    document.getElementById("zoom-to-event")?.addEventListener("click", () => {
      const ts =
        currentEventData?.timestamp ||
        document
          .querySelector(`[data-event-id="${currentEventId}"]`)
          ?.getAttribute("data-event-timestamp");
      const date = parseIsoDate(ts);
      if (!date) return;
      const bufferMs = 5000;
      const paddedStart = new Date(date.getTime() - bufferMs);
      const paddedEnd = new Date(date.getTime() + bufferMs);
      const params = new URLSearchParams(window.location.search);
      params.set("time_range", "custom");
      params.set("start_date", formatTimelineParamDate(paddedStart));
      params.set("end_date", formatTimelineParamDate(paddedEnd));
      params.set("resolution", "100ms");
      if (currentEventId) params.set("focus_event", currentEventId);
      window.location.href = "/invocations/timeline?" + params.toString();
    });

    // Delegated handler for event-panel internal links (emitter / triggered)
    document
      .getElementById("event-details-content")
      ?.addEventListener("click", (e) => {
        const link = e.target.closest(
          ".event-emitter-link[data-invocation-id], " +
            ".event-triggered-link[data-invocation-id]"
        );
        if (!link) return;
        e.preventDefault();
        const invId = link.getAttribute("data-invocation-id");
        if (invId) loadInvocationDetails(invId);
      });
    wireAtomicServiceRunHover(document.getElementById("event-details-content"));

    // Delegated handler for invocation-panel internal links
    document
      .getElementById("invocation-details-content")
      ?.addEventListener("click", (e) => {
        const link = e.target.closest(
          ".event-emitter-link[data-invocation-id], " +
            ".event-triggered-link[data-invocation-id]"
        );
        if (!link) return;
        e.preventDefault();
        const invId = link.getAttribute("data-invocation-id");
        if (invId) loadInvocationDetails(invId);
      });
    wireAtomicServiceRunHover(
      document.getElementById("invocation-details-content")
    );

    // SVG click + hover wiring
    const container = document.getElementById("timeline-container");
    if (container) {
      container.addEventListener("click", (e) => {
        if (timelineRangeZoom.enabled || timelineRangeZoom.suppressNextClick) {
          e.preventDefault();
          e.stopPropagation();
          timelineRangeZoom.suppressNextClick = false;
          return;
        }
        const eventTarget = e.target.closest(
          ".event-marker-link[data-event-id]"
        );
        if (eventTarget) {
          e.preventDefault();
          loadEventDetails(eventTarget.dataset.eventId, eventTarget);
          return;
        }
        const atomicTarget = e.target.closest(
          ".atomic-service-window[data-atomic-service]"
        );
        if (atomicTarget) {
          e.preventDefault();
          loadAtomicServiceDetails(atomicTarget);
          return;
        }
        const target = e.target.closest(
          "rect[data-invocation-id], circle[data-invocation-id]"
        );
        const id = target?.getAttribute("data-invocation-id");
        if (id) loadInvocationDetails(id);
      });

      container.addEventListener("mouseover", (e) => {
        const t = e.target.closest("[data-invocation-id]");
        if (t) {
          const id = t.getAttribute("data-invocation-id");
          highlightInvocation(id);
          setRelatedEventHighlight(relatedEventIdsForInvocation(id), true, id);
        }

        const eventTarget = eventHoverTarget(e.target);
        if (eventTarget)
          highlightEvent(eventTarget.dataset.eventId, true, eventTarget);

        const trTarget = triggerRunHoverTarget(e.target);
        if (trTarget) highlightTriggerRun(trTarget.dataset.triggerRunId, true);

        const atomicTarget = e.target.closest(
          ".atomic-service-window[data-atomic-service]"
        );
        if (atomicTarget) highlightAtomicService(atomicTarget, true);
      });

      container.addEventListener("mouseout", (e) => {
        const t = e.target.closest("[data-invocation-id]");
        if (t) {
          const id = t.getAttribute("data-invocation-id");
          // Don't un-highlight the currently selected invocation
          if (id !== currentInvocationId) unhighlightInvocation(id);
          setRelatedEventHighlight(relatedEventIdsForInvocation(id), false, id);
        }

        const eventTarget = eventHoverTarget(e.target);
        if (eventTarget && !eventTarget.contains(e.relatedTarget)) {
          highlightEvent(eventTarget.dataset.eventId, false, eventTarget);
        }

        const trTarget = triggerRunHoverTarget(e.target);
        if (trTarget && !trTarget.contains(e.relatedTarget)) {
          highlightTriggerRun(trTarget.dataset.triggerRunId, false);
        }

        const atomicTarget = e.target.closest(
          ".atomic-service-window[data-atomic-service]"
        );
        if (
          atomicTarget &&
          atomicTarget !== currentAtomicServiceEl &&
          !atomicTarget.contains(e.relatedTarget)
        ) {
          highlightAtomicService(atomicTarget, false);
        }
      });

      // Runner label hover → highlight entire lane
      container.addEventListener("mouseover", (e) => {
        const rl = e.target.closest(".runner-label[data-runner-id]");
        if (rl) highlightRunner(rl.getAttribute("data-runner-id"));
      });
      container.addEventListener("mouseout", (e) => {
        const rl = e.target.closest(".runner-label[data-runner-id]");
        if (rl) unhighlightRunner(rl.getAttribute("data-runner-id"));
      });
    }

    // Runner context info hover in detail panel → highlight SVG lane
    document.addEventListener("mouseover", (e) => {
      const ri = e.target.closest(".timeline-runner-info[data-runner-id]");
      if (ri) highlightRunner(ri.getAttribute("data-runner-id"));

      const invTarget = invocationHoverTarget(e.target);
      if (invTarget) {
        const id = invTarget.dataset.invocationId;
        highlightInvocation(id);
        setRelatedEventHighlight(relatedEventIdsForInvocation(id), true, id);
      }

      const eventTarget = eventHoverTarget(e.target);
      if (eventTarget)
        highlightEvent(eventTarget.dataset.eventId, true, eventTarget);

      const trTarget = triggerRunHoverTarget(e.target);
      if (trTarget) highlightTriggerRun(trTarget.dataset.triggerRunId, true);
    });
    document.addEventListener("mouseout", (e) => {
      const ri = e.target.closest(".timeline-runner-info[data-runner-id]");
      if (ri) unhighlightRunner(ri.getAttribute("data-runner-id"));

      const invTarget = invocationHoverTarget(e.target);
      if (invTarget && !invTarget.contains(e.relatedTarget)) {
        const id = invTarget.dataset.invocationId;
        if (id !== currentInvocationId) unhighlightInvocation(id);
        setRelatedEventHighlight(relatedEventIdsForInvocation(id), false, id);
      }

      const eventTarget = eventHoverTarget(e.target);
      if (eventTarget && !eventTarget.contains(e.relatedTarget)) {
        highlightEvent(eventTarget.dataset.eventId, false, eventTarget);
      }

      const trTarget = triggerRunHoverTarget(e.target);
      if (trTarget && !trTarget.contains(e.relatedTarget)) {
        highlightTriggerRun(trTarget.dataset.triggerRunId, false);
      }
    });

    // Re-open selected invocation if carried via URL (e.g. after zoom or from detail page)
    const selected = new URLSearchParams(location.search).get("selected");
    if (selected) loadInvocationDetails(selected);

    // Focus on a specific event marker (carried via ?focus_event=...)
    const focusEvent = new URLSearchParams(location.search).get("focus_event");
    if (focusEvent) focusEventMarker(focusEvent);
  });

  function focusEventMarker(eventId) {
    const link = document.querySelector(
      `.event-marker-link[data-event-id="${CSS.escape(eventId)}"]`
    );
    if (!link) return;
    // Scroll the marker into view inside the timeline scroll container.
    try {
      link.scrollIntoView({
        behavior: "smooth",
        block: "center",
        inline: "center",
      });
    } catch (_) {
      link.scrollIntoView();
    }
    // Apply a pulsing highlight class so it's easy to spot.
    link.classList.add("event-marker-focused");
    setTimeout(() => link.classList.remove("event-marker-focused"), 6000);
  }
</script>
